<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispense Product</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #8d72c2, #12c5ed, #f1f1f6);
            color: #333; /* Slightly darker text for contrast */
        }

        #header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 50px;
    align-items: center;
    margin-bottom: auto;
}

#header-text div {
    text-align: center;
    margin: 10px 0;
    font-size: 2vw;
}

        #header-text div {
            margin: 5px 0;
            font-size: 1.2rem; /* Responsive font size */
        }

        #course {
            font-weight: bold;
            font-size: 1rem; /* Adjusted font size */
        }

        #slsulogo {
    width: 160px;
    height: 160px;
    padding: 0 20px;
}
#celogo {
    width: 140px;
    height: 140px;
}
#icpep {
    width: 170px;
    height: 170px;
}
        #front-text {
            font-weight: bold;
            color: #333;
            margin-top: 50px;
            padding: 0 20px; /* Adjusted padding */
            text-align: center;
        }

        /* Ensure the interface doesn't overflow */
        html, body {
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
        }
        

        #left-text {
            position: fixed;
            left: 170px;
            bottom: 180px;
            font-size: 50px;
            font-family: 'Verdana, sans-serif';
            font-weight: bold;
            color: black;
        }
    </style>
</head>
<body>
    <div id="header">
        <img id="slsulogo" src="slsu.png" alt="SLSU Logo">
        <div id="header-text">
            <div>SOUTHERN LEYTE STATE UNIVERSITY</div>
            <div>FACULTY OF ENGINEERING</div>
            <div id="course">Bachelor of Science in Computer Engineering</div>
        </div>
        <img id="celogo" src="celogo.png" alt="CE Logo">
        <img id="icpep" src="icpeplogo.png" alt="">
    </div>

    <div id="left-text">THANK YOU FOR YOUR PURCHASE!</div>

    <script>
        function proceed() {
            window.location.href = 'index.html'; // Redirect to the next page
        }

        // Proceed to the next page after 5 seconds
        setTimeout(proceed, 5000);
    </script>
</body>
</html>
